<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vballstat — Live Volleyball Scouting</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>vballstat</h1>
    <p>Live video scouting prototype — type the rally, click to assist, watch the stats table update</p>
  </header>

  <main class="app-grid">
    <section id="video-panel" class="panel panel-video"></section>
    <section id="roster-panel" class="panel panel-roster"></section>
    <section id="visualizer-panel" class="panel panel-court"></section>
    <section id="log-panel" class="panel panel-log"></section>
    <section id="score-panel" class="panel panel-score"></section>
    <section id="rally-panel" class="panel panel-rally"></section>
    <section id="stats-panel" class="panel panel-stats"></section>
    <section id="report-panel" class="panel panel-report"></section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
